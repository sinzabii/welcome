    <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            background: rgba(0, 0, 0, 1);
            
        }

        .main {
            height: 100dvh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            gap: clamp(1rem, 3vh, 2.5rem);
        }
        
        body {
            height: 100dvh;
            margin: 0;
            background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgb(0, 8, 61) 100%);
            font-family: "Major Mono Display", monospace;
            font-weight: 400;
            font-style: normal;
        }

        .logo-header{
            text-align: center;
        }

        .logo {
            font-family: "Bodoni Moda", serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-size: clamp(5rem, 5.5vw, 10rem);
            line-height: 0.85;
            color: rgba(255, 255, 255, 0.900);
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 450px;
        }

        .box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            font-size: 15px;
            text-align: center;
            color: white;
            background-color: black;
            border: 1px solid #0026fd;
            border-radius: 1px;
            cursor: pointer;
            text-decoration:none;
            transition: background 0.3s ease, border 0.3s ease;
       }

        .box:hover {
            background: rgba(15, 15, 15);
            border: 1px solid #3a6eff;
        }

        .box svg {
            width: clamp(18px, 2.5vh, 28px);
            height: clamp(18px, 2.5vh, 28px);
            flex-shrink: 0;
        }
        
        @media (max-width: 480px) {
            .box {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 0.4rem;
            }
        }
        
    </style>
